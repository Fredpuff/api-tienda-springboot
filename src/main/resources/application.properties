spring.application.name=api-tienda
server.port=${SERVER_PORT:8080}

# PostgreSQL del contenedor Docker (docker-compose.yml lo publica en el puerto 5433
# porque el 5432 lo ocupa el PostgreSQL instalado en Windows).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tiendaya}
spring.datasource.username=${DB_USER:tiendaya}
spring.datasource.password=${DB_PASSWORD:tiendaya123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
